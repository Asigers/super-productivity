<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>企业微信任务同步</title>
    <style>
      body {
        font:
          15px system-ui,
          sans-serif;
        max-width: 760px;
        margin: 24px auto;
        padding: 0 16px;
        line-height: 1.6;
      }
      label {
        display: block;
        margin: 12px 0;
      }
      input,
      select {
        display: block;
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
      }
      button {
        padding: 8px 14px;
        margin: 4px 8px 4px 0;
      }
      section {
        margin: 20px 0;
        border-top: 1px solid #aaa;
        padding-top: 10px;
      }
      .warning {
        color: #a43;
      }
      #status {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>企业微信任务同步</h1>
    <p>
      仅在一台 Windows
      客户端启用。只上传两个项目的未归档主任务；旧表格行不会删除。备注会上传到企业微信。
    </p>
    <form id="config">
      <label
        >智能表格 Webhook（留空表示保留已有地址）<input
          id="webhook"
          type="password"
          autocomplete="off"
          placeholder="https://qyapi.weixin.qq.com/cgi-bin/wedoc/smartsheet/webhook?key=…"
      /></label>
      <label
        >表格选项「ITSM」对应的项目<select
          id="itsm"
          required
        ></select
      ></label>
      <label
        >表格选项「互联互通」对应的项目<select
          id="interop"
          required
        ></select
      ></label>
      <label
        >优先级单选字段 ID（可选，留空则不同步）<input
          id="priorityFieldId"
          type="text"
          autocomplete="off"
          placeholder="例如 fAb123"
      /></label>
      <p>
        启用前请在表格添加单选列，选项设为「高」「中」「低」「未设置」。保存后重新启动会更新已有记录。
      </p>
      <button type="submit">保存配置并暂停</button>
    </form>
    <section>
      <h2>同步</h2>
      <p>
        首次同步会上传当前符合条件的已有任务；修改字段配置后会更新已有记录。先预览数量，再确认启动。
      </p>
      <button id="preview">预览任务数量</button
      ><button
        id="start"
        disabled
      >
        确认并启动同步</button
      ><button id="stop">暂停同步</button>
      <p id="previewResult"></p>
    </section>
    <section
      id="recovery"
      hidden
    >
      <h2>需要人工核对</h2>
      <p class="warning">
        新增结果未知。请在企业微信按任务 ID 查找。找到时输入该行的
        record_id；只有确认没有创建记录后，才能选择「确认不存在」。不能随意重试，否则可能产生重复行。
      </p>
      <p>任务 ID：<code id="pendingId"></code></p>
      <label
        >企业微信 record_id<input
          id="recordId"
          autocomplete="off" /></label
      ><button id="bind">绑定已有记录</button
      ><button id="absent">确认不存在，允许重试</button>
    </section>
    <section>
      <h2>当前状态</h2>
      <p
        id="status"
        role="status"
      ></p>
      <button id="refresh">刷新状态</button
      ><button
        id="ackDates"
        hidden
      >
        确认已手动清空上述日期
      </button>
    </section>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        let pending = null;
        let staleDates = [];
        const call = (action, payload) =>
          new Promise((resolve, reject) => {
            const messageId = crypto.randomUUID();
            const timeout = setTimeout(() => {
              window.removeEventListener('message', receive);
              reject(new Error('请求超时'));
            }, 15000);
            const receive = (event) => {
              if (event.source !== window.parent || event.data?.messageId !== messageId)
                return;
              if (
                event.data.type !== 'PLUGIN_MESSAGE_RESPONSE' &&
                event.data.type !== 'PLUGIN_MESSAGE_ERROR'
              )
                return;
              clearTimeout(timeout);
              window.removeEventListener('message', receive);
              if (event.data.type === 'PLUGIN_MESSAGE_ERROR')
                reject(new Error('操作失败，请检查配置或稍后重试。'));
              else resolve(event.data.result);
            };
            window.addEventListener('message', receive);
            window.parent.postMessage(
              {
                type: 'PLUGIN_MESSAGE',
                messageId,
                message: { type: 'wecom-export', action, payload },
              },
              '*',
            );
          });
        const status = (text) => {
          $('status').textContent = text;
        };
        const refresh = async () => {
          const info = await call('info');
          for (const [id, selected] of [
            ['itsm', info.selected.ITSM],
            ['interop', info.selected['互联互通']],
          ]) {
            const select = $(id);
            select.replaceChildren();
            const blank = document.createElement('option');
            blank.value = '';
            blank.textContent = '请选择项目';
            select.append(blank);
            for (const project of info.projects) {
              const option = document.createElement('option');
              option.value = project.id;
              option.textContent = project.title;
              select.append(option);
            }
            select.value = selected || '';
          }
          $('priorityFieldId').value = info.priorityFieldId;
          pending = info.pending;
          $('recovery').hidden = !pending;
          $('pendingId').textContent = pending?.taskId || '';
          staleDates = info.staleDates;
          $('ackDates').hidden = !staleDates.length;
          status(
            `${info.broken ? '本机映射损坏，已停止；请先恢复本机数据。' : info.enabled ? '自动同步已启用' : '同步已暂停'}\n已映射任务：${info.mapped}\nWebhook：${info.configured ? '已配置' : '未配置'}${info.staleDates.length ? `\n以下任务的计划日期已移除，请在表格中手动清空旧日期：${info.staleDates.join('、')}` : ''}${info.running ? '\n正在同步…' : ''}${info.error ? '\n' + info.error : ''}`,
          );
        };
        const run = (fn) =>
          Promise.resolve()
            .then(fn)
            .catch((err) => status(err.message));
        $('config').addEventListener('submit', (e) => {
          e.preventDefault();
          run(async () => {
            await call('save', {
              webhook: $('webhook').value.trim(),
              itsm: $('itsm').value,
              interop: $('interop').value,
              priorityFieldId: $('priorityFieldId').value.trim(),
            });
            $('webhook').value = '';
            $('start').disabled = true;
            $('previewResult').textContent = '';
            await refresh();
          });
        });
        $('preview').onclick = () =>
          run(async () => {
            const r = await call('preview');
            $('previewResult').textContent =
              `符合条件 ${r.count} 个，其中 ${r.newCount} 个需要新增。请确认后启动。`;
            $('start').disabled = false;
          });
        $('start').onclick = () =>
          run(async () => {
            if (!confirm('确认将这些任务及其备注同步到企业微信？')) return;
            await call('start');
            $('start').disabled = true;
            await refresh();
          });
        $('stop').onclick = () =>
          run(async () => {
            await call('stop');
            await refresh();
          });
        $('refresh').onclick = () => run(refresh);
        $('ackDates').onclick = () =>
          run(async () => {
            if (!confirm('确认已在表格中手动清空所有列出的日期？')) return;
            await call('ack-dates', { taskIds: staleDates });
            await refresh();
          });
        $('bind').onclick = () =>
          run(async () => {
            const recordId = $('recordId').value.trim();
            if (!recordId || !pending || !confirm('确认该 record_id 对应这个任务？'))
              return;
            await call('resolve', { taskId: pending.taskId, recordId });
            $('recordId').value = '';
            await refresh();
          });
        $('absent').onclick = () =>
          run(async () => {
            if (
              !pending ||
              !confirm('请先在表格中按任务 ID 核对。确认该记录不存在并允许重新新增？')
            )
              return;
            await call('resolve', { taskId: pending.taskId, recordId: '' });
            await refresh();
          });
        run(refresh);
      })();
    </script>
  </body>
</html>
