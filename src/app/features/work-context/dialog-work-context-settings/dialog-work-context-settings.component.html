<h1 mat-dialog-title>
  {{ T.MH.SETTINGS | translate }}
</h1>

<mat-dialog-content>
  <formly-form
    (modelChange)="onModelChange($event)"
    [fields]="fields"
    [form]="form"
    [model]="entityData"
  >
  </formly-form>
  @if (isProject && IS_ELECTRON) {
    <pi-project-settings [projectId]="entityData.id"></pi-project-settings>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <div class="wrap-buttons">
    <button
      (click)="cancelEdit()"
      mat-button
      type="button"
    >
      {{ T.G.CANCEL | translate }}
    </button>
    <button
      (click)="done()"
      color="primary"
      mat-flat-button
      type="button"
    >
      {{ T.G.SAVE | translate }}
    </button>
  </div>
</mat-dialog-actions>
